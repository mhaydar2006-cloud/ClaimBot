services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimbot
      POSTGRES_USER: claimbot
      POSTGRES_PASSWORD: claimbot-local-only
    ports:
      - "5432:5432"
    volumes:
      - claimbot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimbot -d claimbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - claimbot_qdrant:/qdrant/storage

  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r backend/requirements.txt && uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://claimbot:claimbot-local-only@postgres:5432/claimbot
      QDRANT_URL: http://qdrant:6333
      CLAIMBOT_CORS_ORIGINS: http://localhost:5173
      CLAIMBOT_JWT_SECRET: ${CLAIMBOT_JWT_SECRET:?Set CLAIMBOT_JWT_SECRET to a random 32+ character value}
      CLAIMBOT_BOOTSTRAP_TOKEN: ${CLAIMBOT_BOOTSTRAP_TOKEN:?Set CLAIMBOT_BOOTSTRAP_TOKEN to a random value}
      CLAIMBOT_ALLOW_PHI: "false"
      CLAIMBOT_DATA_KEY: ${CLAIMBOT_DATA_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  claimbot_postgres:
  claimbot_qdrant:
